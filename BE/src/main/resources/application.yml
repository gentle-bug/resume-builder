server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/resume-builder;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

app:
  jwt:
    secret: Y3ZidWlsZGVycHJvand0c2VjcmV0a2V5Zm9yc2lnbmluZ3Rva2Vuc3RoYXRpc2xvbmdlbm91Z2g=
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
